<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجّل الاجتماعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #eef0ec;
      --card-bg: #ffffff;
      --header-bg: #14191b;
      --brass: #c9a468;
      --brass-deep: #9c7c43;
      --text-dark: #1c2023;
      --text-muted: #6f7a7c;
      --border: #e4e7e2;
      --danger: #b3382c;
      --ok: #2f7a4d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page-bg); color: var(--text-dark);
      font-family: 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif; }
    body { display: flex; justify-content: center; padding: 18px 12px; }
    button { font-family: inherit; }
    .app { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 18px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(20,25,27,.14); align-self: flex-start; }
    header { background: var(--header-bg); padding: 16px 20px; border-bottom: 2px solid var(--brass); }
    header h1 { margin: 0 0 3px; font-family: 'Cairo', sans-serif; font-size: 18px; color: #fff; }
    header p { margin: 0; font-size: 11px; color: var(--brass); }
    main { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--text-muted); }
    .field input { padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: #f7f7f5;
      font-size: 14px; font-family: inherit; outline: none; text-align: right; }
    .field input:focus { border-color: var(--brass); }
    .field input.ltr { direction: ltr; text-align: left; }
    .btn-primary { background: var(--brass); color: #211a0f; border: none; border-radius: 22px; padding: 12px 22px;
      cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: var(--brass-deep); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost { background: #fff; color: var(--text-dark); border: 1px solid var(--border); border-radius: 22px;
      padding: 9px 18px; cursor: pointer; font-size: 13px; }
    .btn-danger { background: var(--danger); color: #fff; border: none; border-radius: 22px; padding: 12px 22px;
      cursor: pointer; font-size: 14px; font-weight: 600; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .timer { font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 700; letter-spacing: 1px; text-align: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--danger);
      margin-left: 8px; animation: blink 1.2s infinite; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
    .status { font-size: 13px; line-height: 1.8; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .hint { font-size: 12px; color: var(--text-muted); line-height: 1.8; margin: 0; }
    .sep { border: none; border-top: 1px solid var(--border); margin: 2px 0; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>مسجّل الاجتماعات</h1>
      <p>مساعد محمد الذكي · شركة الناصر القابضة</p>
    </header>

    <main>
      <!-- الإعداد -->
      <section id="setup" style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <label for="appUrl">رابط تطبيق الويب (ينتهي بـ /exec)</label>
          <input type="text" id="appUrl" class="ltr" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
        </div>
        <div class="field">
          <label for="pin">رمز الدخول</label>
          <input type="password" id="pin" autocomplete="off">
        </div>
        <label class="hint" style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="remember"> تذكّر الرابط والرمز على هذا الجهاز
        </label>
        <div class="row">
          <button class="btn-ghost" id="checkBtn" onclick="checkConnection()">تحقق من الاتصال</button>
          <span class="status" id="checkStatus"></span>
        </div>
      </section>

      <hr class="sep">

      <!-- التسجيل -->
      <section style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <label for="title">عنوان الاجتماع</label>
          <input type="text" id="title" placeholder="مثال: اجتماع لجنة المراجعة">
        </div>
        <div class="timer" id="timerWrap" hidden><span class="dot"></span><span id="timer">00:00</span></div>
        <div class="row">
          <button class="btn-primary" id="startBtn" onclick="startRecording()">● ابدأ التسجيل</button>
          <button class="btn-danger" id="stopBtn" onclick="stopRecording()" hidden>■ إنهاء وحفظ</button>
        </div>
        <div class="status" id="status"></div>
        <p class="hint">
          يُحفظ التسجيل على أجزاء (كل 5 دقائق) في مجلد التسجيلات على الدرايف. أبقِ هذه الصفحة مفتوحة والشاشة شغّالة حتى تضغط «إنهاء».
          بعد الاجتماع افتح «مساعد محمد الذكي» ← تبويب الاجتماعات ← «تفريغ وتلخيص».
        </p>
      </section>
    </main>
  </div>

  <script>
    var $ = function (id) { return document.getElementById(id); };
    var SEGMENT_MS = 5 * 60 * 1000;
    var rec = null;

    function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function unstore(k) { try { localStorage.removeItem(k); } catch (e) {} }
    function stored(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    (function restore() {
      var u = stored('rec_url'), p = stored('rec_pin');
      if (u) $('appUrl').value = u;
      if (p) { $('pin').value = p; $('remember').checked = true; }
    })();

    function setStatus(text, kind, id) {
      var s = $(id || 'status');
      s.textContent = text || '';
      s.className = 'status' + (kind ? ' ' + kind : '');
    }

    function getConfig() {
      var url = $('appUrl').value.trim();
      var pin = $('pin').value;
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
        throw new Error('الرابط غير صحيح. يجب أن يبدأ بـ https://script.google.com وينتهي بـ /exec');
      }
      if (!pin) throw new Error('أدخل رمز الدخول.');
      return { url: url, pin: pin };
    }

    function persist(cfg) {
      if ($('remember').checked) { store('rec_url', cfg.url); store('rec_pin', cfg.pin); }
      else { unstore('rec_url'); unstore('rec_pin'); }
    }

    async function api(cfg, payload) {
      payload.pin = cfg.pin;
      var res = await fetch(cfg.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      var data;
      try { data = await res.json(); }
      catch (e) {
        throw new Error('الرابط لا يرد كتطبيق ويب مفتوح. تأكد أن النشر على «أي شخص» وأنك نشرت نسخة جديدة بعد إضافة doPost.');
      }
      if (!data.ok) throw new Error(data.error || 'خطأ غير معروف');
      return data.data;
    }

    function withRetry(fn, tries) {
      var attempt = 0;
      function run() {
        return fn().catch(function (e) {
          attempt++;
          if (attempt >= tries) throw e;
          return sleep(1500 * attempt).then(run);
        });
      }
      return run();
    }

    async function checkConnection() {
      setStatus('', '', 'checkStatus');
      $('checkBtn').disabled = true;
      try {
        var cfg = getConfig();
        await api(cfg, { action: 'ping' });
        persist(cfg);
        setStatus('الاتصال سليم ✓', 'ok', 'checkStatus');
      } catch (e) {
        setStatus(e.message, 'err', 'checkStatus');
      }
      $('checkBtn').disabled = false;
    }

    function blobToBase64(blob) {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () { resolve(String(fr.result).split(',')[1] || ''); };
        fr.onerror = function () { reject(new Error('تعذّر قراءة الصوت')); };
        fr.readAsDataURL(blob);
      });
    }

    function pickMime() {
      var options = [
        { mime: 'audio/webm;codecs=opus', ext: 'webm' },
        { mime: 'audio/ogg;codecs=opus', ext: 'ogg' },
        { mime: 'audio/mp4', ext: 'm4a' }
      ];
      if (!window.MediaRecorder) return null;
      for (var i = 0; i < options.length; i++) {
        if (MediaRecorder.isTypeSupported(options[i].mime)) return options[i];
      }
      return { mime: '', ext: 'webm' };
    }

    function fmtTime(sec) {
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      function p(n) { return (n < 10 ? '0' : '') + n; }
      return (h ? p(h) + ':' : '') + p(m) + ':' + p(s);
    }

    function requestWakeLock() {
      try {
        if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { if (rec) rec.wake = l; }).catch(function () {});
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () {
      if (rec && !rec.stopping && document.visibilityState === 'visible') requestWakeLock();
    });
    window.addEventListener('beforeunload', function (e) {
      if (rec) { e.preventDefault(); e.returnValue = ''; }
    });

    async function startRecording() {
      if (rec) return;
      var cfg;
      try { cfg = getConfig(); } catch (e) { setStatus(e.message, 'err'); return; }

      var mt = pickMime();
      if (!mt || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('هذا المتصفح لا يدعم التسجيل. افتح الصفحة بمتصفح حديث (Chrome أو Safari) عبر رابط https.', 'err');
        return;
      }

      var stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
        });
      } catch (e) {
        setStatus('تعذّر تشغيل الميكروفون. اسمح للمتصفح باستخدامه (القفل 🔒 بجانب شريط العنوان) وتأكد أن الصفحة مفتوحة عبر https أو من ملف على جهازك.', 'err');
        return;
      }

      $('startBtn').disabled = true;
      setStatus('جارٍ تجهيز مجلد الاجتماع...');
      var session;
      try {
        session = await api(cfg, { action: 'start', title: $('title').value.trim() || 'اجتماع' });
        persist(cfg);
      } catch (e) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        $('startBtn').disabled = false;
        setStatus(e.message, 'err');
        return;
      }

      rec = {
        cfg: cfg, stream: stream, mt: mt, folderId: session.folderId,
        part: 0, saved: 0, failedBlobs: [], stopping: false, recorder: null, segTimer: null,
        queue: Promise.resolve(), startedAt: Date.now(), tick: null, wake: null
      };
      requestWakeLock();
      $('startBtn').hidden = true;
      $('stopBtn').hidden = false;
      $('timerWrap').hidden = false;
      rec.tick = setInterval(function () {
        $('timer').textContent = fmtTime(Math.floor((Date.now() - rec.startedAt) / 1000));
      }, 1000);
      setStatus('التسجيل شغّال. لا تغلق الصفحة.');
      startSegment();
    }

    function startSegment() {
      var r = rec;
      var opts = { audioBitsPerSecond: 48000 };
      if (r.mt.mime) opts.mimeType = r.mt.mime;
      var recorder = new MediaRecorder(r.stream, opts);
      var chunks = [];
      var idx = ++r.part;
      var baseType = (r.mt.mime || 'audio/webm').split(';')[0];

      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function () {
        clearTimeout(r.segTimer);
        if (!r.stopping) startSegment();
        enqueueUpload(r, new Blob(chunks, { type: baseType }), idx);
      };
      r.recorder = recorder;
      recorder.start();
      r.segTimer = setTimeout(function () { if (recorder.state === 'recording') recorder.stop(); }, SEGMENT_MS);
    }

    function uploadBlob(r, blob, idx) {
      return blobToBase64(blob).then(function (b64) {
        return withRetry(function () {
          return api(r.cfg, { action: 'part', folderId: r.folderId, index: idx, base64: b64, ext: r.mt.ext });
        }, 4);
      });
    }

    // الأجزاء التي فشل رفعها تبقى في ذاكرة الصفحة ويُعاد رفعها لاحقاً
    function retryFailed(r) {
      var list = r.failedBlobs;
      r.failedBlobs = [];
      var chain = Promise.resolve();
      list.forEach(function (it) {
        chain = chain.then(function () {
          return uploadBlob(r, it.blob, it.idx)
            .then(function () { r.saved++; })
            .catch(function () { r.failedBlobs.push(it); });
        });
      });
      return chain;
    }

    function enqueueUpload(r, blob, idx) {
      if (!blob.size) return;
      r.queue = r.queue.then(function () {
        return uploadBlob(r, blob, idx).then(function () {
          r.saved++;
          if (!r.stopping) setStatus('التسجيل شغّال. تم حفظ ' + r.saved + ' جزء على الدرايف.');
          return retryFailed(r);
        }).catch(function (e) {
          r.failedBlobs.push({ blob: blob, idx: idx });
          setStatus('تحذير: تعذّر رفع الجزء ' + idx + ' (' + e.message + '). التسجيل مستمر وسيُعاد رفعه تلقائياً.', 'err');
        });
      });
    }

    async function stopRecording() {
      if (!rec) return;
      var r = rec;
      $('stopBtn').disabled = true;

      if (!r.stopping) {
        r.stopping = true;
        setStatus('جارٍ حفظ آخر جزء...');
        clearInterval(r.tick);
        clearTimeout(r.segTimer);
        await new Promise(function (resolve) {
          if (r.recorder && r.recorder.state !== 'inactive') {
            var prev = r.recorder.onstop;
            r.recorder.onstop = function () { prev(); resolve(); };
            r.recorder.stop();
          } else resolve();
        });
      } else {
        setStatus('جارٍ إعادة محاولة رفع الأجزاء...');
      }
      await r.queue;
      await retryFailed(r);

      if (r.failedBlobs.length) {
        $('stopBtn').disabled = false;
        $('stopBtn').textContent = '↻ إعادة محاولة رفع الأجزاء';
        setStatus('تعذّر رفع ' + r.failedBlobs.length + ' جزء. الأجزاء محفوظة مؤقتاً في هذه الصفحة. تأكد من الاتصال واضغط الزر مجدداً، ولا تغلق الصفحة.', 'err');
        return;
      }

      r.stream.getTracks().forEach(function (t) { t.stop(); });
      try { if (r.wake) r.wake.release(); } catch (e) {}

      var saved = r.saved;
      rec = null;
      $('stopBtn').hidden = true;
      $('stopBtn').disabled = false;
      $('stopBtn').textContent = '■ إنهاء وحفظ';
      $('startBtn').hidden = false;
      $('startBtn').disabled = false;
      $('timerWrap').hidden = true;
      $('timer').textContent = '00:00';

      if (!saved) {
        setStatus('لم يُحفظ أي جزء من التسجيل. تحقق من الاتصال والرمز وحاول مجدداً.', 'err');
        return;
      }
      setStatus('تم حفظ التسجيل (' + saved + ' جزء). افتح «مساعد محمد الذكي» ← الاجتماعات ← «تفريغ وتلخيص».', 'ok');
    }
  </script>
</body>
</html>
